name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Clean stale caches and build directories
        run: |
          echo "Removing project-level Gradle caches and app build directory..."
          rm -rf .gradle
          rm -rf app/build

      - name: Create Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating a new one..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: locate_apk
        run: |
          echo "Searching for generated debug APK files..."
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" -print -quit)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_ENV

      - name: Verify APK Validity
        run: |
          if [ ! -f "$apk_path" ]; then
            echo "Error: Verified APK file not found at $apk_path!"
            exit 1
          fi
          echo "APK verified successfully."

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: ${{ env.apk_path }}
          if-no-files-found: error
